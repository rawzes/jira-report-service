name: CI

on:
  push:
    branches: ["*"]  # Run on all branches
  pull_request:
    branches: ["*"]  # Run on all PRs

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx pydantic-settings tenacity
    
    - name: Run tests
      run: |
        pytest tests/ -v --tb=short
      env:
        JIRA_BASE_URL: https://test.atlassian.net
        JIRA_EMAIL: test@example.com
        JIRA_API_TOKEN: test-token
    
    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
  
  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t jira-report:latest .
    
    - name: Test Docker image
      run: |
        docker run --rm \
          -e JIRA_BASE_URL=https://test.atlassian.net \
          -e JIRA_EMAIL=test@example.com \
          -e JIRA_API_TOKEN=test-token \
          jira-report:latest python -c "from app.main import app; print('Import successful')"
